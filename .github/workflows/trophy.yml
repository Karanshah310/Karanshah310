name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Generate trophies
        uses: ryo-ma/github-profile-trophy@v3
        with:
          username: Karanshah310
          output_path: trophy/github-trophies.svg
          theme: onedark
          title: false
          column: 6
          row: 2

      - name: Commit trophies
        uses: EndBug/add-and-commit@v9
        with:
          add: "trophy/github-trophies.svg"
          message: "Update GitHub trophies"
